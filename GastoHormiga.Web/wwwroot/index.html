<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>GastoHormiga — Toma el control de tus finanzas</title>
    <meta name="description" content="Controla tus gastos hormiga y suscripciones. Descubre cuanto dinero pierdes cada mes y como puedes ahorrarlo." />
    <meta name="keywords" content="gasto hormiga, finanzas personales, ahorro, presupuesto, Chile" />
    <meta name="author" content="GastoHormiga" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GastoHormiga — Toma el control de tus finanzas" />
    <meta property="og:description" content="Controla tus gastos hormiga y suscripciones. Descubre cuanto dinero pierdes cada mes." />

    <!-- PWA -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Design System -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="GastoHormiga.Web.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- Splash screen mientras carga Blazor -->
        <div style="
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            color: #f1f5f9;
            font-family: Inter, sans-serif;
            gap: 1.5rem;
        ">
            <div style="
                font-size: 3rem;
                font-weight: 900;
                background: linear-gradient(135deg, #00d4aa, #4f8ef7);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                letter-spacing: -2px;
            ">GastoHormiga</div>
            <div style="
                width: 40px; height: 40px;
                border: 3px solid rgba(255,255,255,0.1);
                border-top-color: #00d4aa;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            "></div>
            <p style="color: #64748b; font-size: 0.875rem;">Cargando aplicacion...</p>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>

    <div id="blazor-error-ui" style="
        display: none;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #1a2340;
        border-top: 1px solid rgba(248,113,113,0.3);
        padding: 1rem 1.5rem;
        color: #fca5a5;
        font-family: Inter, sans-serif;
        font-size: 0.875rem;
        z-index: 9999;
        text-align: center;
    ">
        Ocurrio un error inesperado.
        <a href="" style="color: #00d4aa; margin-left: 0.5rem;">Recargar</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
